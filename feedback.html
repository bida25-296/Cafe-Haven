<!DOCTYPE html> 
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFE HAVEN</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        body{
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f4f4f4;
            font-family: 'Arial', sans-serif;
        }

        .feedback-page {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 100px;
     }

        .feedback-container {
        max-width: 600px;
        width: 80%;
        background-color: white;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        text-align: center;
    }

        .feedback-container h2{
        margin-top: 50px;
        margin-bottom: 30px;
        color:#4e342e;
   }

        /*form fields*/
       .form-group{
        margin-bottom: 15px;
   }

.form-group input,
.form-group textarea,
.form-group select{
    width: 80%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
}

.form-group textarea{
    resize: vertical;
    min-height: 100px;
}

/*Submit button*/
.submit-btn {
    width: 80%;
    padding: 12px;
    background-color: #f3961c;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.submit-btn:hover{
    background-color: #f3961c;
}

/*footer*/
Footer{
    background-color:#3b141c;
    text-align: center;
    padding: 20px;
    color: white;
}

</style>
</head>
<body>
    <header>
        <nav class="navbar">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>

                </li>
            <li class="nav-item">
                    <a class="nav-link" href="about.html">About</a>

                </li>
            <li class="nav-item">
                    <a class="nav-link" href="menu.html">Menu</a>

                </li>
            <li class="nav-item">
                    <a class="nav-link" href="gallery.html">Gallery</a>

                </li>
            <li class="nav-item">
                    <a class="nav-link" href="feedback.html">Feedback</a>

                </li>
            <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>

                </li>
                
            </ul>
        </nav>
    </header>

    <form action="https://formsubmit.co/rebaonetaboka@gmail.com" method="POST">
        <input type="hidden" name="_next" value="https://cafehaven.com/thankyou.html">
        <input type="hidden" name="_captcha" value="false">
        <div class="form-group">
            <input type="text" name="name" placeholder="Your Name" required>
        </div>
        <div class="form-group">
            <input type="email" name="email" placeholder="Your Email" required>
        </div>
        <div class="form-group">
            <select name="experience" required>
                <option value="">How was your experience?</option>
                <option value="excellent">Excellent</option>
                <option value="good">Good</option>
                <option value="average">Average</option>
                <option value="poor">Poor</option>
            </select>
        </div>
        <div class="form-group">
            <textarea name="message" placeholder="Your Feedback..." required></textarea>
        </div>
        <button type="submit" class="btn">Submit Feedback</button>
    </form>
        

    <!--Footer Section-->
     <footer>
        <div class="footer-section">
            <p>@ 2026 CAFE HAVEN. Privacy Policy | Refund Policy</p>
        </div>
   </footer>
</body>

</html>
