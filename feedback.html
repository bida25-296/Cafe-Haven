    <!--Feedback Section-->
     <section id="feedback" class="feedback-page">
        <div class="feedback-container">
            <h2>We value your feedback!</h2>

    <form action="https://formsubmit.co/rebaonetaboka@gmail.com" method="POST">
        <input type="hidden" name="_next" value="https://cafehaven.com/thankyou.html">
        <input type="hidden" name="_captcha" value="false">
        <div class="form-group">
            <input type="text" name="name" placeholder="Your Name" required>
        </div>
        <div class="form-group">
            <input type="email" name="email" placeholder="Your Email" required>
        </div>
        <div class="form-group">
            <select name="experience" required>
                <option value="">How was your experience?</option>
                <option value="excellent">Excellent</option>
                <option value="good">Good</option>
                <option value="average">Average</option>
                <option value="poor">Poor</option>
            </select>
        </div>
        <div class="form-group">
            <textarea name="message" placeholder="Your Feedback..." required></textarea>
        </div>
        <button type="submit" class="btn">Submit Feedback</button>
    </form>
        </div>
    </section>
